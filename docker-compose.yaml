version: '3'
services:
  cinematica:
    build:
      context: .
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    ports:
      - '8001:8000' # host:container
  cinema_data:
    image: 'postgres:17'
    environment:
      POSTGRES_DB: cinematica_db
      POSTGRES_USER: cinematica_user
      POSTGRES_PASSWORD: 1234
    volumes:
      - 'data:/var/lib/postgresql/data'
volumes:
  data:
